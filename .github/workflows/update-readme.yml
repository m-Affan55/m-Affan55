name: "Auto-Update README Stats"

on:
  schedule:
    # Runs daily at 12:00 AM PKT (07:00 PM UTC)
    - cron: "0 19 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  update-readme:
    name: "Refresh live stats"
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the commit back

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Fetch GitHub stats and update README"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: "m-Affan55"
        run: python .github/scripts/update_readme.py

      - name: "Commit and push if README changed"
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || (
            git commit -m "chore: auto-sync stats [$(TZ='Asia/Karachi' date +'%b %d, %Y')]" &&
            git push
          )
