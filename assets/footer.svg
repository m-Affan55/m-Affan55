<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ftLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8a838" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="110" fill="url(#ftBg)" rx="8" stroke="#30363d" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#ftLine)"/>

  <!-- Message -->
  <text x="450" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" letter-spacing="0.5">
    Interested in building something useful?
  </text>

  <!-- Subtitle -->
  <text x="450" y="68" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#7d8590">
    Let's connect and create something that works.
  </text>

  <!-- Terminal Prompt -->
  <g>
    <text x="450" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#e8a838">
      &gt; echo "hello" | affan --connect _
    </text>
  </g>
</svg>
