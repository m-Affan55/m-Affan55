<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2030" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <!-- Amber glow gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e8a838" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#e8a838" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Scan line effect -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e8a838" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#e8a838" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="#e8a838" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="8"/>
  <rect width="900" height="280" fill="url(#grid)" rx="8"/>
  <rect width="900" height="280" fill="url(#vignette)" rx="8"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="60" fill="url(#scanGrad)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 -60; 0 340" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top border accent line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#amberGlow)" rx="1">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Left decorative bracket -->
  <g opacity="0.15" transform="translate(30, 60)">
    <text font-family="'Courier New', monospace" font-size="120" fill="#e8a838" font-weight="300">{</text>
  </g>

  <!-- Right decorative bracket -->
  <g opacity="0.15" transform="translate(830, 200)">
    <text font-family="'Courier New', monospace" font-size="120" fill="#e8a838" font-weight="300">}</text>
  </g>

  <!-- Line numbers (decorative) -->
  <g opacity="0.12" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">
    <text x="60" y="55">01</text>
    <text x="60" y="75">02</text>
    <text x="60" y="95">03</text>
    <text x="60" y="115">04</text>
    <text x="60" y="135">05</text>
    <text x="60" y="155">06</text>
    <text x="60" y="175">07</text>
    <text x="60" y="195">08</text>
    <text x="60" y="215">09</text>
    <text x="60" y="235">10</text>
  </g>

  <!-- Vertical line (code editor gutter) -->
  <line x1="82" y1="40" x2="82" y2="245" stroke="#30363d" stroke-width="1" opacity="0.4"/>

  <!-- Main Name -->
  <text x="450" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="48" font-weight="700" fill="#e6edf3" letter-spacing="6">AFFAN ASIM</text>

  <!-- Subtitle line -->
  <text x="450" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#7d8590" letter-spacing="3">CS STUDENT  ·  SOFTWARE DEVELOPER  ·  BUILDER</text>

  <!-- Amber divider under subtitle -->
  <rect x="300" y="155" width="300" height="1" fill="url(#amberGlow)" opacity="0.6"/>

  <!-- Typing tagline -->
  <text x="450" y="188" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#e8a838" opacity="0">
    <tspan>&gt; learn. build. debug. deploy. repeat.</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.2;1" dur="3s" fill="freeze"/>
  </text>

  <!-- Blinking cursor after tagline -->
  <rect x="658" y="174" width="10" height="18" fill="#e8a838">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;450;658;658" keyTimes="0;0.15;0.2;1" dur="3s" fill="freeze"/>
  </rect>

  <!-- Status indicators at bottom -->
  <g transform="translate(260, 225)">
    <!-- Git branch indicator -->
    <circle cx="0" cy="0" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">main</text>

    <!-- Build status -->
    <circle cx="80" cy="0" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="4" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">building</text>

    <!-- Deployment status -->
    <circle cx="185" cy="0" r="4" fill="#e8a838">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="197" y="4" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">deploying</text>

    <!-- Learning status -->
    <circle cx="300" cy="0" r="4" fill="#58a6ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="312" y="4" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">learning</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="278" width="900" height="2" fill="url(#amberGlow)" rx="1" opacity="0.4"/>
</svg>
