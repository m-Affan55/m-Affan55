<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Terminal window background -->
  <rect x="20" y="10" width="860" height="300" fill="url(#termBg)" rx="10" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M 20 20 Q 20 10 30 10 L 870 10 Q 880 10 880 20 L 880 44 L 20 44 Z" fill="url(#titleBar)"/>
  <line x1="20" y1="44" x2="880" y2="44" stroke="#30363d" stroke-width="1"/>

  <!-- Window control buttons -->
  <circle cx="46" cy="27" r="5.5" fill="#f85149"/>
  <circle cx="64" cy="27" r="5.5" fill="#e8a838"/>
  <circle cx="82" cy="27" r="5.5" fill="#3fb950"/>

  <!-- Title text -->
  <text x="450" y="31" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#7d8590">affan@dev: ~/projects/nutrisense</text>

  <!-- Terminal content -->

  <!-- Line 1: prompt + command -->
  <g>
    <text x="50" y="75" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">affan</tspan><tspan fill="#7d8590">@</tspan><tspan fill="#58a6ff">dev</tspan><tspan fill="#7d8590"> ~ $ </tspan><tspan fill="#e6edf3">docker compose up -d --build</tspan>
    </text>
  </g>

  <!-- Line 2: Backend API -->
  <g>
    <text x="50" y="102" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">  ✔ </tspan><tspan fill="#7d8590">Container </tspan><tspan fill="#e6edf3">fastapi-backend</tspan><tspan fill="#7d8590">  Started  </tspan><tspan fill="#e8a838">:8000</tspan>
    </text>
  </g>

  <!-- Line 3: PostgreSQL -->
  <g>
    <text x="50" y="128" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">  ✔ </tspan><tspan fill="#7d8590">Container </tspan><tspan fill="#e6edf3">postgres-db</tspan><tspan fill="#7d8590">      Healthy  </tspan><tspan fill="#e8a838">:5432</tspan>
    </text>
  </g>

  <!-- Line 4: Redis -->
  <g>
    <text x="50" y="154" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">  ✔ </tspan><tspan fill="#7d8590">Container </tspan><tspan fill="#e6edf3">redis-cache</tspan><tspan fill="#7d8590">      Running  </tspan><tspan fill="#e8a838">:6379</tspan>
    </text>
  </g>

  <!-- Line 5: flutter command -->
  <g>
    <text x="50" y="186" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">affan</tspan><tspan fill="#7d8590">@</tspan><tspan fill="#58a6ff">dev</tspan><tspan fill="#7d8590"> ~ $ </tspan><tspan fill="#e6edf3">flutter run --release -d android</tspan>
    </text>
  </g>

  <!-- Line 6: Build success -->
  <g>
    <text x="50" y="212" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">  ✔ </tspan><tspan fill="#7d8590">Built </tspan><tspan fill="#e8a838">NutriSense v1.0.apk</tspan><tspan fill="#7d8590"> — Camera &amp; barcode pipeline active</tspan>
    </text>
  </g>

  <!-- Line 7: k6 load test -->
  <g>
    <text x="50" y="244" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">affan</tspan><tspan fill="#7d8590">@</tspan><tspan fill="#58a6ff">dev</tspan><tspan fill="#7d8590"> ~ $ </tspan><tspan fill="#e6edf3">k6 run --vus 50 --duration 30s load-test.js</tspan>
    </text>
  </g>

  <!-- Line 8: Performance result -->
  <g>
    <text x="50" y="270" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">  ✔ </tspan><tspan fill="#7d8590">checks: </tspan><tspan fill="#3fb950">100%</tspan><tspan fill="#7d8590"> | avg: </tspan><tspan fill="#3fb950">42ms</tspan><tspan fill="#7d8590"> | p95: </tspan><tspan fill="#e8a838">89ms</tspan><tspan fill="#7d8590"> | reqs: </tspan><tspan fill="#58a6ff">10,000</tspan>
    </text>
  </g>

  <!-- Terminal prompt & cursor -->
  <g>
    <text x="50" y="295" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#3fb950">affan</tspan><tspan fill="#7d8590">@</tspan><tspan fill="#58a6ff">dev</tspan><tspan fill="#7d8590"> ~ $ </tspan><tspan fill="#e8a838">_</tspan>
    </text>
  </g>
</svg>
