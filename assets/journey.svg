<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="jBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#jBg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#e8a838" letter-spacing="4" opacity="0">
    ENGINEERING JOURNEY
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Vertical timeline line -->
  <line x1="450" y1="60" x2="450" y2="460" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- ===== NODE 1: Foundations (Left) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <!-- Connector line -->
    <line x1="380" y1="90" x2="445" y2="90" stroke="#e8a838" stroke-width="1" opacity="0.5"/>
    <!-- Node dot -->
    <circle cx="450" cy="90" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="450" cy="90" r="3" fill="#e8a838"/>
    <!-- Card -->
    <rect x="120" y="65" width="255" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="135" y="85" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">01 FOUNDATIONS</text>
    <text x="135" y="103" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">C++ · DSA · OOP · Problem Solving</text>
  </g>

  <!-- ===== NODE 2: Data and ML (Right) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.1s" fill="freeze"/>
    <line x1="455" y1="160" x2="520" y2="160" stroke="#e8a838" stroke-width="1" opacity="0.5"/>
    <circle cx="450" cy="160" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="450" cy="160" r="3" fill="#e8a838"/>
    <rect x="525" y="135" width="260" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="155" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">02 DATA &amp; ML</text>
    <text x="540" y="173" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Python · Pandas · Scikit-learn</text>
  </g>

  <!-- ===== NODE 3: Web and APIs (Left) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.7s" fill="freeze"/>
    <line x1="380" y1="230" x2="445" y2="230" stroke="#e8a838" stroke-width="1" opacity="0.5"/>
    <circle cx="450" cy="230" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="450" cy="230" r="3" fill="#e8a838"/>
    <rect x="110" y="205" width="265" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="125" y="225" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">03 WEB &amp; APIs</text>
    <text x="125" y="243" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">FastAPI · REST · SQLAlchemy · JWT</text>
  </g>

  <!-- ===== NODE 4: Mobile (Right) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.3s" fill="freeze"/>
    <line x1="455" y1="300" x2="520" y2="300" stroke="#e8a838" stroke-width="1" opacity="0.5"/>
    <circle cx="450" cy="300" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="450" cy="300" r="3" fill="#e8a838"/>
    <rect x="525" y="275" width="260" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="295" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">04 MOBILE</text>
    <text x="540" y="313" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Flutter · Dart · Riverpod</text>
  </g>

  <!-- ===== NODE 5: Systems (Left) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.9s" fill="freeze"/>
    <line x1="380" y1="370" x2="445" y2="370" stroke="#e8a838" stroke-width="1" opacity="0.5"/>
    <circle cx="450" cy="370" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="450" cy="370" r="3" fill="#e8a838"/>
    <rect x="100" y="345" width="275" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="115" y="365" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">05 SYSTEMS</text>
    <text x="115" y="383" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Docker · PostgreSQL · Redis · k6</text>
  </g>

  <!-- ===== NODE 6: AI Apps (Right) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.5s" fill="freeze"/>
    <line x1="455" y1="440" x2="520" y2="440" stroke="#e8a838" stroke-width="1" opacity="0.5"/>
    <circle cx="450" cy="440" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="450" cy="440" r="3" fill="#e8a838"/>
    <rect x="525" y="415" width="265" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="435" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">06 AI APPLICATIONS</text>
    <text x="540" y="453" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Gemini · NutriSense · RecSys</text>
  </g>

  <!-- Animated pulse on the timeline -->
  <circle cx="450" cy="60" r="4" fill="#e8a838" opacity="0.6">
    <animate attributeName="cy" values="60;460;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
