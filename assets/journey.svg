<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="jBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#jBg)" rx="8" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#e8a838" letter-spacing="3">
    ENGINEERING ROADMAP &amp; JOURNEY
  </text>

  <!-- Vertical timeline line -->
  <line x1="450" y1="55" x2="450" y2="455" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- ===== NODE 1: Foundations (Left) ===== -->
  <g>
    <!-- Connector line -->
    <line x1="380" y1="88" x2="445" y2="88" stroke="#e8a838" stroke-width="1.5" opacity="0.6"/>
    <!-- Node dot -->
    <circle cx="450" cy="88" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2"/>
    <circle cx="450" cy="88" r="3.5" fill="#e8a838"/>
    <!-- Card -->
    <rect x="110" y="63" width="265" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="125" y="83" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">01 FOUNDATIONS</text>
    <text x="125" y="101" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">C++ · DSA · OOP · Problem Solving</text>
  </g>

  <!-- ===== NODE 2: Data and ML (Right) ===== -->
  <g>
    <line x1="455" y1="155" x2="520" y2="155" stroke="#e8a838" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="155" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2"/>
    <circle cx="450" cy="155" r="3.5" fill="#e8a838"/>
    <rect x="525" y="130" width="265" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="150" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">02 DATA &amp; ML</text>
    <text x="540" y="168" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Python · Pandas · Scikit-learn</text>
  </g>

  <!-- ===== NODE 3: Web and APIs (Left) ===== -->
  <g>
    <line x1="380" y1="225" x2="445" y2="225" stroke="#e8a838" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="225" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2"/>
    <circle cx="450" cy="225" r="3.5" fill="#e8a838"/>
    <rect x="100" y="200" width="275" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="115" y="220" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">03 WEB &amp; APIs</text>
    <text x="115" y="238" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">FastAPI · REST · SQLAlchemy · JWT</text>
  </g>

  <!-- ===== NODE 4: Mobile (Right) ===== -->
  <g>
    <line x1="455" y1="295" x2="520" y2="295" stroke="#e8a838" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="295" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2"/>
    <circle cx="450" cy="295" r="3.5" fill="#e8a838"/>
    <rect x="525" y="270" width="265" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="290" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">04 MOBILE</text>
    <text x="540" y="308" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Flutter · Dart · Riverpod</text>
  </g>

  <!-- ===== NODE 5: Systems (Left) ===== -->
  <g>
    <line x1="380" y1="365" x2="445" y2="365" stroke="#e8a838" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="365" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2"/>
    <circle cx="450" cy="365" r="3.5" fill="#e8a838"/>
    <rect x="90" y="340" width="285" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="105" y="360" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">05 SYSTEMS &amp; DEVOPS</text>
    <text x="105" y="378" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Docker · PostgreSQL · Redis · k6</text>
  </g>

  <!-- ===== NODE 6: AI Apps (Right) ===== -->
  <g>
    <line x1="455" y1="435" x2="520" y2="435" stroke="#e8a838" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="435" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2"/>
    <circle cx="450" cy="435" r="3.5" fill="#e8a838"/>
    <rect x="525" y="410" width="265" height="50" fill="url(#cardBg)" rx="6" stroke="#30363d" stroke-width="1"/>
    <text x="540" y="430" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8a838">06 AI APPLICATIONS</text>
    <text x="540" y="448" font-family="'Courier New', monospace" font-size="11" fill="#7d8590">Gemini AI · NutriSense · Graph RecSys</text>
  </g>
</svg>
