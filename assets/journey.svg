<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="jBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      /* Timeline animated draw */
      .tl { stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawLine 1.6s ease forwards 0.3s; }
      @keyframes drawLine { to { stroke-dashoffset: 0; } }

      /* Title */
      .ttl { opacity: 0; animation: fadeIn 0.8s ease forwards 0.1s; }

      /* Cards slide in */
      .c1 { opacity: 0; animation: sL 0.55s cubic-bezier(.22,1,.36,1) forwards 0.7s; }
      .c2 { opacity: 0; animation: sR 0.55s cubic-bezier(.22,1,.36,1) forwards 1.0s; }
      .c3 { opacity: 0; animation: sL 0.55s cubic-bezier(.22,1,.36,1) forwards 1.3s; }
      .c4 { opacity: 0; animation: sR 0.55s cubic-bezier(.22,1,.36,1) forwards 1.6s; }
      .c5 { opacity: 0; animation: sL 0.55s cubic-bezier(.22,1,.36,1) forwards 1.9s; }
      @keyframes sL { from { opacity:0; transform:translateX(-28px); } to { opacity:1; transform:translateX(0); } }
      @keyframes sR { from { opacity:0; transform:translateX(28px);  } to { opacity:1; transform:translateX(0); } }
      @keyframes fadeIn { to { opacity:1; } }

      /* Connectors */
      .k1 { opacity: 0; animation: fadeIn 0.3s ease forwards 0.75s; }
      .k2 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.05s; }
      .k3 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.35s; }
      .k4 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.65s; }
      .k5 { opacity: 0; animation: fadeIn 0.3s ease forwards 1.95s; }

      /* Node centers pulse */
      .p1 { animation: pulse 2.6s ease-in-out infinite 0.8s; }
      .p2 { animation: pulse 2.6s ease-in-out infinite 1.1s; }
      .p3 { animation: pulse 2.6s ease-in-out infinite 1.4s; }
      .p4 { animation: pulse 2.6s ease-in-out infinite 1.7s; }
      .p5 { animation: pulse 2.6s ease-in-out infinite 2.0s; }
      @keyframes pulse {
        0%,100% { opacity:1; }
        50%      { opacity:0.35; }
      }

      /* Outer ripple rings */
      .r1 { animation: ripple 2.6s ease-out infinite 0.8s; }
      .r2 { animation: ripple 2.6s ease-out infinite 1.1s; }
      .r3 { animation: ripple 2.6s ease-out infinite 1.4s; }
      .r4 { animation: ripple 2.6s ease-out infinite 1.7s; }
      .r5 { animation: ripple 2.6s ease-out infinite 2.0s; }
      @keyframes ripple {
        0%   { r:8;  opacity:0.6; }
        100% { r:20; opacity:0;   }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#jBg)" rx="8" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text class="ttl" x="450" y="34" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="15" font-weight="bold"
        fill="#e8a838" letter-spacing="3">ENGINEERING ROADMAP &amp; JOURNEY</text>

  <!-- Vertical timeline (animated draw) -->
  <line class="tl" x1="450" y1="48" x2="450" y2="378"
        stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ===== NODE 1: Foundations (Left) ===== -->
  <circle class="r1" cx="450" cy="78" r="8" fill="none" stroke="#e8a838" stroke-width="1.2" opacity="0"/>
  <line class="k1" x1="375" y1="78" x2="442" y2="78" stroke="#e8a838" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="78" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#glow)"/>
  <circle class="p1" cx="450" cy="78" r="4" fill="#e8a838"/>
  <g class="c1">
    <rect x="100" y="53" width="270" height="50" fill="url(#cardBg)" rx="6"
          stroke="#e8a838" stroke-width="0.6" stroke-opacity="0.45" filter="url(#softGlow)"/>
    <text x="115" y="74" font-family="'Courier New', monospace" font-size="13"
          font-weight="700" fill="#e8a838">01 FOUNDATIONS</text>
    <text x="115" y="92" font-family="'Courier New', monospace" font-size="11"
          fill="#7d8590">C++ · DSA · OOP · Problem Solving</text>
  </g>

  <!-- ===== NODE 2: Data and ML (Right) ===== -->
  <circle class="r2" cx="450" cy="148" r="8" fill="none" stroke="#e8a838" stroke-width="1.2" opacity="0"/>
  <line class="k2" x1="458" y1="148" x2="522" y2="148" stroke="#e8a838" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="148" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#glow)"/>
  <circle class="p2" cx="450" cy="148" r="4" fill="#e8a838"/>
  <g class="c2">
    <rect x="527" y="123" width="265" height="50" fill="url(#cardBg)" rx="6"
          stroke="#e8a838" stroke-width="0.6" stroke-opacity="0.45" filter="url(#softGlow)"/>
    <text x="542" y="144" font-family="'Courier New', monospace" font-size="13"
          font-weight="700" fill="#e8a838">02 DATA &amp; ML</text>
    <text x="542" y="162" font-family="'Courier New', monospace" font-size="11"
          fill="#7d8590">Python · Pandas · Scikit-learn</text>
  </g>

  <!-- ===== NODE 3: Web and APIs (Left) ===== -->
  <circle class="r3" cx="450" cy="218" r="8" fill="none" stroke="#e8a838" stroke-width="1.2" opacity="0"/>
  <line class="k3" x1="375" y1="218" x2="442" y2="218" stroke="#e8a838" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="218" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#glow)"/>
  <circle class="p3" cx="450" cy="218" r="4" fill="#e8a838"/>
  <g class="c3">
    <rect x="95" y="193" width="275" height="50" fill="url(#cardBg)" rx="6"
          stroke="#e8a838" stroke-width="0.6" stroke-opacity="0.45" filter="url(#softGlow)"/>
    <text x="110" y="214" font-family="'Courier New', monospace" font-size="13"
          font-weight="700" fill="#e8a838">03 WEB &amp; APIs</text>
    <text x="110" y="232" font-family="'Courier New', monospace" font-size="11"
          fill="#7d8590">FastAPI · REST · SQLAlchemy · JWT</text>
  </g>

  <!-- ===== NODE 4: Mobile (Right) ===== -->
  <circle class="r4" cx="450" cy="288" r="8" fill="none" stroke="#e8a838" stroke-width="1.2" opacity="0"/>
  <line class="k4" x1="458" y1="288" x2="522" y2="288" stroke="#e8a838" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="288" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#glow)"/>
  <circle class="p4" cx="450" cy="288" r="4" fill="#e8a838"/>
  <g class="c4">
    <rect x="527" y="263" width="265" height="50" fill="url(#cardBg)" rx="6"
          stroke="#e8a838" stroke-width="0.6" stroke-opacity="0.45" filter="url(#softGlow)"/>
    <text x="542" y="284" font-family="'Courier New', monospace" font-size="13"
          font-weight="700" fill="#e8a838">04 MOBILE</text>
    <text x="542" y="302" font-family="'Courier New', monospace" font-size="11"
          fill="#7d8590">Flutter · Dart · Riverpod</text>
  </g>

  <!-- ===== NODE 5: Systems and DevOps (Left) ===== -->
  <circle class="r5" cx="450" cy="358" r="8" fill="none" stroke="#e8a838" stroke-width="1.2" opacity="0"/>
  <line class="k5" x1="375" y1="358" x2="442" y2="358" stroke="#e8a838" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="450" cy="358" r="8" fill="#0d1117" stroke="#e8a838" stroke-width="2" filter="url(#glow)"/>
  <circle class="p5" cx="450" cy="358" r="4" fill="#e8a838"/>
  <g class="c5">
    <rect x="85" y="333" width="285" height="50" fill="url(#cardBg)" rx="6"
          stroke="#e8a838" stroke-width="0.6" stroke-opacity="0.45" filter="url(#softGlow)"/>
    <text x="100" y="354" font-family="'Courier New', monospace" font-size="13"
          font-weight="700" fill="#e8a838">05 SYSTEMS &amp; DEVOPS</text>
    <text x="100" y="372" font-family="'Courier New', monospace" font-size="11"
          fill="#7d8590">Docker · PostgreSQL · Redis · k6</text>
  </g>
</svg>
